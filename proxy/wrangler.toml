name = "llm-course-tutor-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"

# 自定义域名：workers.dev 在部分国内网络被 DNS 污染，访问不到；改用自己的域名。
# 要求 taleverse.cn 的 DNS 托管在本 Cloudflare 账号下（已把名称服务器改为 Cloudflare）。
# 保留 workers.dev 入口作为兜底，两个地址指向同一个 Worker、共用同一份限额。
workers_dev = true
routes = [
  { pattern = "tutor.taleverse.cn", custom_domain = true }
]

[vars]
# 只允许这个站点调用；多个用英文逗号分隔。Origin 可以被伪造，只能挡掉普通滥用，真正的保护是下面的限额。
ALLOWED_ORIGINS = "https://zhuangzhaoyeye.github.io"
PER_IP_PER_MINUTE = "5"
PER_IP_PER_DAY = "20"
# 整站每天一共多少次（所有人加起来）。各 1 次实测（高峰价）：不联网约 0.0008 元（265 入/35 出，但那是不带卡片正文的短问题，是下限）；联网约 0.032 元（9795 入/315 出 + 2 次搜索），约 40 倍。真实使用带卡片正文，费用介于两者之间偏下。
GLOBAL_PER_DAY = "100"
# 联网搜索开关与单次最多搜索次数（搜索按成功次数计费，见 DeepSeek 价格页）
WEB_SEARCH = "false"
WEB_SEARCH_MAX_USES = "2"
MAX_TOKENS = "2048"

# DEEPSEEK_API_KEY 不写在这里。部署时用: npx wrangler secret put DEEPSEEK_API_KEY
# ID_SALT 同理（任意随机字符串，用来给 IP 哈希加盐）: npx wrangler secret put ID_SALT

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
